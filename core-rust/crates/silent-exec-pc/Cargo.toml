[package]
name = "silent-exec-pc"
version = "0.1.0"
edition = "2021"
authors = ["tahadeab-ai"]
description = "PC Executor, Arabic/English Fuzzy Indexer and Model Downloader for SilentExec"
license = "MIT"

[dependencies]
silent-exec-core = { path = "../silent-exec-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[lib]
name = "silent_exec_pc"
path = "src/lib.rs"

[[bin]]
name = "silent-exec-pc"
path = "src/main.rs"
