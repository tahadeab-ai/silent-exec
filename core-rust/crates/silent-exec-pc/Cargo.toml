[package]
name = "silent-exec-pc"
version = "0.5.0"
edition = "2021"
authors = ["tahadeab-ai"]
description = "PC Executor, Arabic/English Fuzzy Indexer and Model Downloader for SilentExec"
license = "MIT"

[dependencies]
silent-exec-core = { path = "../silent-exec-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
]

[lib]
name = "silent_exec_pc"
path = "src/lib.rs"

[[bin]]
name = "silent-exec-pc"
path = "src/main.rs"
