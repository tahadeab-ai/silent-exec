[package]
name = "silent-exec-desktop"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "sync"] }
silent-exec-core = { path = "../../core-rust/crates/silent-exec-core" }
silent-exec-pc = { path = "../../core-rust/crates/silent-exec-pc" }

[build-dependencies]
tauri-build = { version = "2" }
