name: Release PC Windows Binary

on:
  push:
    tags:
      - 'v*-pc'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v4.0.0-pc)'
        required: true
        default: 'v4.0.0-pc'

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build-and-release-pc:
    name: Build & Publish Windows x86_64 Binary
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary (silent-exec-pc)
        run: cargo build --release --bin silent-exec-pc --manifest-path core-rust/Cargo.toml

      - name: Build Release Desktop GUI App (SilentExec-Desktop)
        run: cargo build --release --manifest-path desktop-app/src-tauri/Cargo.toml

      - name: Package Assets & Generate Checksum
        shell: bash
        run: |
          mkdir -p release_assets
          if [ -f "core-rust/target/release/silent-exec-pc.exe" ]; then
            cp core-rust/target/release/silent-exec-pc.exe release_assets/
          else
            cp $(find core-rust -name "silent-exec-pc.exe" | head -n 1) release_assets/
          fi
          
          if [ -f "desktop-app/src-tauri/target/release/silent-exec-desktop.exe" ]; then
            cp desktop-app/src-tauri/target/release/silent-exec-desktop.exe release_assets/SilentExec-Desktop-x64.exe
          else
            cp $(find desktop-app -name "silent-exec-desktop.exe" | head -n 1) release_assets/SilentExec-Desktop-x64.exe
          fi
          cd release_assets
          sha256sum silent-exec-pc.exe SilentExec-Desktop-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SilentExec PC Agent ${{ env.RELEASE_TAG }}"
          body: |
            Automated production build for SilentExec PC Agent and Desktop GUI (`${{ env.RELEASE_TAG }}`).

            - **Platform**: Windows x86_64
            - **Desktop GUI**: `SilentExec-Desktop-x64.exe` (Tauri v2, RTL Split-Pane Workspace, Live Inspector, Takeover Banner)
            - **CLI / Bar**: `silent-exec-pc.exe`
            - **Silent Execution**: `cua-driver` (MIT) background window targeting + `capture_id` staleness guard + Agent-S3 code-first DPI scaling
            - **Vision Fallback**: Microsoft OmniParser (`icon_detect_v3`) element grounding
            - **LAN Bridge**: Authenticated WebSocket JSON-RPC 2.0 (`8081`) + HTTP health (`8080`) with 6-digit pairing token & PII Privacy Mode
            - **Safety Gate**: Deterministic 3-Tier validation with `--dry-run` and confirmation gates
          files: |
            release_assets/silent-exec-pc.exe
            release_assets/SilentExec-Desktop-x64.exe
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
