name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  validate-schemas:
    name: Validate JSON Schemas, Dataset Generator & Notebook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Run Schema, Safety Policy and GBNF Validation
        run: python schemas/validate_schemas.py

      - name: Verify Dataset Generator & Schema Adherence
        run: python nlp-training/generate_dataset.py --count 300 --out-dir /tmp/ci_data

      - name: Validate Colab Training Notebook Syntax & Structure
        run: python nlp-training/validate_notebook.py

  rust-checks-and-eval:
    name: Rust Quality, Safety Gate Tests & Golden Benchmark Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core-rust -> target"

      - name: Format Check (cargo fmt)
        run: cargo fmt --check

      - name: Linter Check (cargo clippy)
        run: cargo clippy -- -D warnings

      - name: Unit Tests (cargo test)
        run: cargo test --workspace --verbose

      - name: Build CLI Evaluator
        run: cargo build --bin silent-exec-cli

      - name: Build PC Agent
        run: cargo build --bin silent-exec-pc

      - name: Run Golden Benchmark Evaluation (Rust SafetyGate Oracle Check)
        run: python ../evals/run_eval.py --oracle-check --rust-bin target/debug/silent-exec-cli
