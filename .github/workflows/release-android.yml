name: Release Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v4.0.0-android)'
        required: true
        default: 'v4.0.0-android'

jobs:
  build-and-release-android:
    name: Build & Publish Android arm64-v8a APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android Environment & NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Installed NDKs:"
          ls -la "$ANDROID_HOME/ndk/" || true
          cmake --version || true

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "ANDROID_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not set."
          fi

      - name: Run Unit Tests & Build Release APK
        working-directory: android-agent
        run: |
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Package Assets & Verify Native Shared Library and Signature
        shell: bash
        run: |
          mkdir -p release_assets
          APK_SOURCE=$(find android-agent/app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No release APK found to package!"
            exit 1
          fi
          cp "$APK_SOURCE" release_assets/silent-exec-android-arm64.apk
          cd release_assets

          echo "Inspecting native shared libraries inside release APK..."
          unzip -l silent-exec-android-arm64.apk | grep "lib/arm64-v8a"
          if ! unzip -l silent-exec-android-arm64.apk | grep -q "lib/arm64-v8a/libllama_jni.so"; then
            echo "Error: libllama_jni.so missing from release APK!"
            exit 1
          fi
          echo "SUCCESS: Verified real offline llama.cpp native library in release APK!"

          echo "Verifying APK signature via apksigner..."
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose silent-exec-android-arm64.apk
          elif [ -n "$ANDROID_HOME" ]; then
            BUILD_TOOLS_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$BUILD_TOOLS_BIN" ]; then
              "$BUILD_TOOLS_BIN" verify --verbose silent-exec-android-arm64.apk
            fi
          fi

          sha256sum silent-exec-android-arm64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Clean up temporary keystore
        if: always()
        run: |
          rm -f /tmp/release.keystore

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SilentExec Android Agent ${{ env.RELEASE_TAG }}"
          body: |
            Automated production build for SilentExec Android Agent (`silent-exec-android-arm64.apk`) ${{ env.RELEASE_TAG }}.

            - **Platform**: Android (`arm64-v8a`)
            - **Deterministic State-Machine Agent**: `CompoundIntentGuard` + `PlanManager` + 30+ Native Android Intent Executors (`open_app`, `youtube_search`, `web_search`, `dial_number`, `set_alarm`, `copy_clipboard`, `share_text`)
            - **Mobilerun-Style Observation & Batch Execution**: Compact `phone_state + a11y_tree [0..N]` representation + `batch_actions` + `StateHashReflector` + `Notetaker`
            - **Edge-Docked HUD**: WindowInsets-aware draggable HUD (`TYPE_ACCESSIBILITY_OVERLAY`) hidden when SilentExec is foregrounded, auto-fading during gestures/screenshots
            - **On-Device llama.cpp v1.1.0**: Top-k/Top-p/Min-penalty sampler, `<think>` token budget guard, Q8_0 KV-cache prefix reuse, `Qwen3.5-2B-Q4_K_M` & `LFM3-VL-2B` presets
            - **LAN Bridge (JSON-RPC 2.0)**: Authenticated WebSocket bridge (`device.get_state`, `device.execute_batch` with `capture_id`, `planner.offload_step`) + Clean-Room PII Privacy Mode
            - **Safety Gate**: Deterministic 3-Tier safety policy with multi-step plan evaluation & human-in-the-loop takeover UX
            - **Target SDK**: 35 (Android 15), Min SDK 26 (Android 8.0)

            ### Installation
            ```bash
            adb install -r silent-exec-android-arm64.apk
            ```
          files: |
            release_assets/silent-exec-android-arm64.apk
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
