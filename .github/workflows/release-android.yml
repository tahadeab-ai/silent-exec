name: Release Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.4.0-android)'
        required: true
        default: 'v0.4.0-android'

jobs:
  build-and-release-android:
    name: Build & Publish Android arm64-v8a APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android Environment & NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Installed NDKs:"
          ls -la "$ANDROID_HOME/ndk/" || true
          cmake --version || true

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      - name: Run Unit Tests & Build APK
        working-directory: android-agent
        run: |
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Package Assets & Verify Native Shared Library
        shell: bash
        run: |
          mkdir -p release_assets
          APK_SOURCE=$(find android-agent/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No APK found to package!"
            exit 1
          fi
          cp "$APK_SOURCE" release_assets/silent-exec-android-arm64.apk
          cd release_assets

          echo "Inspecting native shared libraries inside release APK..."
          unzip -l silent-exec-android-arm64.apk | grep "lib/arm64-v8a"
          if ! unzip -l silent-exec-android-arm64.apk | grep -q "lib/arm64-v8a/libllama_jni.so"; then
            echo "Error: libllama_jni.so missing from release APK!"
            exit 1
          fi
          echo "SUCCESS: Verified real offline llama.cpp native library in release APK!"

          sha256sum silent-exec-android-arm64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SilentExec Android Agent ${{ env.RELEASE_TAG }}"
          body: |
            Automated production build for SilentExec Android Agent (`silent-exec-android-arm64.apk`) v0.4.0.

            - **Platform**: Android (`arm64-v8a`)
            - **Observe-Think-Act Closed Loop**: Full multi-step screen-aware agent loop (max 6 steps) with GBNF grammar constrained generation
            - **GUI Agent**: Full multi-step GUI Automation via AccessibilityService (`ui_click`, `ui_type`, `ui_scroll`, `ui_back`, `ui_home`)
            - **Interactive Mode**: Explicit step confirmation card (`[Run | Skip | Stop]`) for every resolved step
            - **Dry-Run Mode**: Full NLP & SafetyGate evaluation without executing OS mutations
            - **Live Floating Status Pill**: Compact interactive overlay showing live execution stage with 1-tap instant stop (`⏹`)
            - **Fast Rule Router**: Deterministic <15ms Arabic (Yemeni + MSA) & English pattern matcher with compound-command guard
            - **Material 3 Day/Night Theme**: Seamless Dark and Light theme with custom geometric launcher icon
            - **KV-Cache Prompt Caching**: Static ChatML prefix KV-cache reuse in `libllama_jni.so` for accelerated repeat on-device execution
            - **Dynamic Model Hub & Self-Updater**: In-app download, activation, and management of GGUF models and APK updates
            - **Quick Settings Tile**: 1-tap voice & text execution from any screen
            - **Bilingual Material 3 UI**: Instant Arabic RTL / English LTR locale switching
            - **Safety Gate**: Deterministic 3-Tier safety policy with multi-step plan evaluation
            - **Target SDK**: 35 (Android 15), Min SDK 26 (Android 8.0)

            ### Installation
            ```bash
            adb install -r silent-exec-android-arm64.apk
            ```
          files: |
            release_assets/silent-exec-android-arm64.apk
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
