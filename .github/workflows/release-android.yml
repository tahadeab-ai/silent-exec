name: Release Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0-android)'
        required: true
        default: 'v0.1.0-android'

jobs:
  build-and-release-android:
    name: Build & Publish Android arm64-v8a APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      - name: Run Unit Tests & Build APK
        working-directory: android-agent
        run: |
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Package Assets & Generate Checksum
        shell: bash
        run: |
          mkdir -p release_assets
          APK_SOURCE=$(find android-agent/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No APK found to package!"
            exit 1
          fi
          cp "$APK_SOURCE" release_assets/silent-exec-android-arm64.apk
          cd release_assets
          sha256sum silent-exec-android-arm64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SilentExec Android Agent ${{ env.RELEASE_TAG }}"
          body: |
            Automated production build for SilentExec Android Agent (`silent-exec-android-arm64.apk`).

            - **Platform**: Android (`arm64-v8a`)
            - **Target SDK**: 35 (Android 15), Min SDK 26 (Android 8.0)
            - **Safety Gate**: Deterministic 3-Tier safety policy with interactive confirmation dialogs
            - **Integration**: Native Intents, System Managers, Accessibility Service, and LAN Bridge Client
            
            ### Installation
            ```bash
            adb install -r silent-exec-android-arm64.apk
            ```
          files: |
            release_assets/silent-exec-android-arm64.apk
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
