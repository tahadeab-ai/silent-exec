name: Release Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0-android)'
        required: true
        default: 'v0.2.0-android'

jobs:
  build-and-release-android:
    name: Build & Publish Android arm64-v8a APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android Environment & NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Installed NDKs:"
          ls -la "$ANDROID_HOME/ndk/" || true
          cmake --version || true

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      - name: Run Unit Tests & Build APK
        working-directory: android-agent
        run: |
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Package Assets & Verify Native Shared Library
        shell: bash
        run: |
          mkdir -p release_assets
          APK_SOURCE=$(find android-agent/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No APK found to package!"
            exit 1
          fi
          cp "$APK_SOURCE" release_assets/silent-exec-android-arm64.apk
          cd release_assets

          echo "Inspecting native shared libraries inside release APK..."
          unzip -l silent-exec-android-arm64.apk | grep "lib/arm64-v8a"
          if ! unzip -l silent-exec-android-arm64.apk | grep -q "lib/arm64-v8a/libllama_jni.so"; then
            echo "Error: libllama_jni.so missing from release APK!"
            exit 1
          fi
          echo "SUCCESS: Verified real offline llama.cpp native library in release APK!"

          sha256sum silent-exec-android-arm64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SilentExec Android Agent ${{ env.RELEASE_TAG }}"
          body: |
            Automated production build for SilentExec Android Agent (`silent-exec-android-arm64.apk`) v0.2.0.

            - **Platform**: Android (`arm64-v8a`)
            - **Offline NLP**: Real on-device `llama.cpp` inference engine (`libllama_jni.so`) with GBNF grammar constraints
            - **Model Downloader**: Built-in streaming downloader for `Qwen2.5-0.5B-Instruct.Q4_K_M.gguf` (379 MB) with SHA-256 integrity verification
            - **Voice Input**: Native zero-overhead Arabic (`ar-SA`) & English speech recognition
            - **Dual Mode**: Seamless toggling between **Offline (On-Device)** and **LAN Bridge (PC)**
            - **Safety Gate**: Deterministic 3-Tier safety policy with interactive confirmation dialogs
            - **Target SDK**: 35 (Android 15), Min SDK 26 (Android 8.0)

            ### Installation
            ```bash
            adb install -r silent-exec-android-arm64.apk
            ```
          files: |
            release_assets/silent-exec-android-arm64.apk
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
